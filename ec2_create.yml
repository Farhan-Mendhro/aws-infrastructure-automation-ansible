---
- name: Provision with Multi-OS EC2 Infrastructure
  hosts: localhost
  connection: local
  vars_files:
    - group_vars/all/pass.yml

  tasks:
    - name: Create EC2 instances
      amazon.aws.ec2_instance:
        name: "{{ item.name }}"
        instance_type: t3.micro
        image_id: "{{ item.ami }}"
        region: ap-south-1
        key_name: my-aws-key
        aws_access_key: "{{ ec2_access_key }}"
        aws_secret_key: "{{ ec2_secret_key }}"
        network:
          assign_public_ip: true
        state: running
        tags:
          Name: "{{ item.name }}"
          OS: "{{ item.os }}"
      loop:
        - { name: "ubuntu-node-1" , ami: "ami-07a00cf47dbbc844c" , os: "Ubuntu" }
        - { name: "ubuntu-node-2" , ami: "ami-07a00cf47dbbc844c" , os: "Ubuntu" }
        - { name: "rhel-node-1" , ami: "ami-00a3ff4223e36738"  , os: "RHEL" }
