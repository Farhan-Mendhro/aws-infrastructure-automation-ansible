---

- hosts: localhost
  connection: local
  vars_files:
    - group_vars/all/pass.yml

  tasks:
    - name: Create EC2 instances
      amazon.aws.ec2_instance:
        name: "{{ item.name }}"
        key_name: "shark-key"
        instance_type: t3.micro
        security_group: default
        region: ap-south-1
        aws_access_key: "{{ ec2_access_key }}" #vault as default
        aws_secret_key: "{{ ec2_secret_key }}" #vault as default
        network:
          assign_public_ip: true
        image_id: "{{ item.image }}"
        tags:
          environment: "{{ item.name }}"
      loop:
        - { image: ami-07a00cf47dbbc844c, name: "managed-node-1" }
        - { image: ami-00a3ff43223e36738, name: "managed-node-2" }
        - { image: ami-07a00cf47dbbc844c, name: "managed-node-3" }
